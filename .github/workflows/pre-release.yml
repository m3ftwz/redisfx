name: Create pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          TGT_RELEASE_VERSION: ${{ github.event.inputs.tag }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/redisfx/{web,lib}
          cp ./{LICENSE,README.md,fxmanifest.lua,ui.lua} ./temp/redisfx
          cp ./lib/Redis.lua ./temp/redisfx/lib
          cp -r ./dist ./logger ./temp/redisfx
          cp -r ./web/build ./temp/redisfx/web/
          cd ./temp && zip -r ../redisfx.zip ./redisfx

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          tag_name: ${{ github.event.inputs.tag }}
          files: redisfx.zip
