name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check Lua wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 tests/unit/lib/Redis.test.lua

      - name: Run unit tests with coverage (enforces 85% minimum)
        run: bun run test:coverage

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test real driver with RESP2 and RESP3
        run: bun run test:integration
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
