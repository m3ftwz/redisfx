name: Create release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    # Belt-and-braces against a bot-authored push retriggering a release.
    if: github.actor_id != 41898282
    runs-on: ubuntu-latest
    steps:
      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Set lib package version
        # The published npm package must carry the tag's version, otherwise every release after
        # the first is rejected as "version already exists".
        run: |
          VER=$(echo "$TAG" | sed -E 's/^[^0-9]*//')
          npm version "$VER" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ github.ref_name }}
        working-directory: lib

      - name: Push version bump change
        uses: EndBug/add-and-commit@v9
        with:
          add: '["package.json", "lib/package.json"]'
          push: true
          default_author: github_actions
          message: 'chore: bump version to ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/redisfx/{web,lib}
          cp ./{LICENSE,README.md,fxmanifest.lua,ui.lua} ./temp/redisfx
          cp ./lib/Redis.lua ./temp/redisfx/lib
          cp -r ./dist ./logger ./temp/redisfx
          cp -r ./web/build ./temp/redisfx/web/
          cd ./temp && zip -r ../redisfx.zip ./redisfx

      # Publish first: npm rejects a re-publish of an existing version, so if the token or the
      # version is wrong it should fail before a user-visible GitHub release is created.
      - name: Publish lib to npm registry
        run: npm publish --access public
        working-directory: lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: redisfx.zip
